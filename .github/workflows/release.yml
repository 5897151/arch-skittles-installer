name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require release prerequisites and matching version
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s LICENSE || { echo "LICENSE is required before publishing a release." >&2; exit 1; }
          version=$(sed -n 's/^readonly VERSION=//p' skittles-installer.sh)
          test -n "$version"
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match installer VERSION=${version}." >&2
            exit 1
          }

      - name: Re-run release validation
        shell: bash
        run: |
          set -Eeuo pipefail
          shellcheck --version
          bash -n skittles-installer.sh
          shellcheck skittles-installer.sh
          python3 -m unittest discover -s tests -v
          git diff --check

      - name: Build reproducible release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          version=${GITHUB_REF_NAME#v}
          bundle="skittles-${version}"
          epoch=$(git show -s --format=%ct HEAD)

          rm -rf dist
          mkdir -p "dist/${bundle}"
          cp skittles-installer.sh README.md LICENSE CHANGELOG.md SECURITY.md CONTRIBUTING.md release-signoff.json "dist/${bundle}/"
          chmod 0755 "dist/${bundle}/skittles-installer.sh"
          cp -R docs "dist/${bundle}/"
          printf '%s\n' "$GITHUB_SHA" > "dist/${bundle}/SOURCE_COMMIT"

          cp skittles-installer.sh "dist/skittles-installer-${version}.sh"
          chmod 0755 "dist/skittles-installer-${version}.sh"

          tar --sort=name --mtime="@${epoch}" --owner=0 --group=0 --numeric-owner \
            -C dist -cf - "$bundle" | gzip -n > "dist/${bundle}.tar.gz"

          (
            cd dist
            sha256sum "${bundle}.tar.gz" "skittles-installer-${version}.sh" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Attest release artifact provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/skittles-*.tar.gz
            dist/skittles-installer-*.sh
            dist/SHA256SUMS

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          version=${GITHUB_REF_NAME#v}
          bundle="skittles-${version}"
          notes_file="docs/RELEASE-NOTES-${GITHUB_REF_NAME}.md"
          test -s "$notes_file" || { echo "Missing curated release notes: $notes_file" >&2; exit 1; }
          release_flags=()
          if [[ $version == *-* ]]; then
            release_flags+=(--prerelease)
          else
            python3 scripts/check_release_signoff.py \
              release-signoff.json docs/PERFORMANCE.md "$notes_file"
          fi

          gh release create "$GITHUB_REF_NAME" \
            "dist/${bundle}.tar.gz" \
            "dist/skittles-installer-${version}.sh" \
            dist/SHA256SUMS \
            --verify-tag \
            --title "SKITTLES ${GITHUB_REF_NAME}" \
            --notes-file "$notes_file" \
            "${release_flags[@]}"
